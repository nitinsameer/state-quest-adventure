  <path d="M 0 145 Q 50 125 100 145 T 200 145 T 300 145" stroke="#0284C7" stroke-width="2" fill="none" opacity="0.4"/>
  
  <!-- Dot pattern (top center) -->
  <circle cx="130" cy="35" r="2.5" fill="#0284C7" opacity="0.9"/>
  <circle cx="145" cy="38" r="2" fill="#0EA5E9" opacity="0.7"/>
  <circle cx="158" cy="36" r="1.5" fill="#CCCCCC" opacity="0.6"/>
