  <rect width="300" height="170" fill="#E0F2FE"/>
  
  <!-- Top wave -->
  <path d="M 0 60 Q 50 40 100 60 T 200 60 T 300 60" stroke="#0EA5E9" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 0 70 Q 50 50 100 70 T 200 70 T 300 70" stroke="#0EA5E9" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- Bottom wave -->
