*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--font);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:0;text-align:left}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.phone{max-width:480px;margin:0 auto;padding:18px 18px calc(110px + env(safe-area-inset-bottom,0px))}
.raise,.row,.les,.opt,.tile,.star,.back,.cta.alt,nav{backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.raise{background:var(--card);border:var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.hello{display:flex;gap:12px;align-items:center}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:#ffe3c4;flex:none;border:var(--bd);box-shadow:var(--shs)}
small{color:var(--mute);font-size:13px;font-weight:700}
h1,h2,h3{font-family:var(--fonth);text-shadow:var(--tsh)}
h1{font-size:21px;font-weight:900;margin:2px 0 0;line-height:1.15}
h2{margin:0;font-weight:900}h3{margin:0;font-size:17px;font-weight:900}h4{margin:16px 0 10px;font-size:16px;font-weight:900}
.star{padding:9px 14px;border-radius:99px;font-weight:900;white-space:nowrap;text-align:center;background:var(--card);border:var(--bd);box-shadow:var(--shs)}
.goal{border-radius:var(--r);padding:20px;color:var(--onacc);margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--accentg);border:var(--bd);box-shadow:var(--shbtn);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.goal small{color:inherit;opacity:.8}.goal b{display:block;font-size:20px;margin:2px 0 10px}.goal .emo{font-size:58px;filter:drop-shadow(4px 6px 5px rgba(0,0,0,.25))}
.bar{height:13px;width:190px;max-width:100%;border-radius:99px;background:rgba(0,0,0,.2);border:var(--bdt);box-shadow:inset 2px 2px 5px rgba(0,0,0,.25);overflow:hidden}
.bar i{display:block;height:100%;background:var(--barfill);border-radius:99px;transition:width .4s}
.bar.p{background:var(--well);box-shadow:var(--sin);width:100%;height:11px}.bar.p i{background:var(--accent)}
.sec{display:flex;justify-content:space-between;margin:4px 0 12px}
.subs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px 12px;border-radius:var(--r);font-weight:900;font-size:14px;text-align:center;color:var(--tilec);background:var(--tilebg);border:var(--bd);box-shadow:var(--sht);transition:transform .12s}
.tile:active,.row:active,.les:active,.opt:active,.cta:active{transform:scale(.97)}
.ti{font-size:36px;line-height:1;filter:drop-shadow(2px 4px 3px rgba(0,0,0,.2))}
.ti.sm{font-size:28px;width:52px;height:52px;display:grid;place-items:center;border-radius:var(--rs);background:var(--tilebg);border:var(--bdt);box-shadow:var(--shs);flex:none}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;margin-bottom:14px;border-radius:var(--r);background:var(--card);border:var(--bd);box-shadow:var(--sh);transition:transform .12s}
.row .m{flex:1;min-width:0}.row b{display:block;font-weight:900}.row .pc{font-size:12px;color:var(--mute);font-weight:800;float:right}
.hero{position:relative;height:230px;border-radius:0 0 var(--r) var(--r);border-bottom:var(--bd);margin:-18px -18px 0;overflow:hidden;display:grid;place-items:center}
.hero .big{font-size:110px;filter:drop-shadow(6px 10px 8px rgba(0,0,0,.25));margin-top:10px}.hero .d{position:absolute;filter:drop-shadow(3px 5px 4px rgba(0,0,0,.18))}
.back{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;z-index:2;width:46px;height:46px;border-radius:50%;font-size:22px;font-weight:900;text-align:center;background:var(--card);border:var(--bd);box-shadow:var(--shs)}
.ccard{position:relative;z-index:1;margin:-30px 0 0;padding:24px 16px 20px}
.chead{display:flex;gap:12px;align-items:center}.chead h2{font-size:21px}.chead>div{flex:1}
.lvl{padding:6px 12px;border-radius:99px;background:var(--lvlbg);color:var(--lvlc);border:var(--bdt);font-size:12px;font-weight:900}
.ccard p{color:var(--mute);margin:12px 0}
.stats{display:flex;gap:8px;flex-wrap:wrap}.stats span{padding:7px 11px;border-radius:14px;font-size:12px;font-weight:800;background:var(--well);border:var(--bdt);box-shadow:var(--sin)}
.les{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin-bottom:10px;border-radius:var(--rs);background:var(--card);border:var(--bd);box-shadow:var(--shs);transition:transform .12s}
.les>div{flex:1}.les b{display:block;font-size:15px;font-weight:900}
.les .num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:var(--well);border:var(--bdt);box-shadow:var(--sin)}
.les.done .num{background:var(--green);color:#fff}.les.cur{background:var(--curbg);color:var(--curc)}.les.cur small{color:inherit;opacity:.75}.les.cur .num{background:var(--accent);color:var(--onacc)}
.les:disabled{opacity:.6;cursor:not-allowed}
.cta{display:block;width:100%;text-align:center;margin-top:14px;padding:16px;border-radius:var(--r);font-size:17px;font-weight:900;color:var(--onacc);background:var(--accentg);border:var(--bd);box-shadow:var(--shbtn);transition:transform .12s}
.cta.green{background:var(--greeng);color:var(--ongr,#fff)}.cta:disabled{opacity:.45}
.cta.alt{background:var(--card);color:var(--ink);box-shadow:var(--shs)}
.segs{display:flex;gap:8px;margin:6px 0 8px}.segs i{flex:1;height:8px;border-radius:9px;background:var(--well);border:var(--bdt)}.segs i.on{background:var(--green)}.segs i.cur{background:var(--barfill)}
.qcard{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:20px;margin:14px 0}.qcard h2{font-size:21px}.qe{font-size:60px;filter:drop-shadow(3px 5px 4px rgba(0,0,0,.2))}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;margin-bottom:12px;border-radius:var(--rs);font-weight:900;background:var(--card);border:var(--bd);box-shadow:var(--shs);transition:transform .12s}
.let{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#f0a64a;flex:none;font-weight:900}.opt:nth-child(2) .let{background:#5aa8f0}.opt:nth-child(3) .let{background:#7c5cf0}.opt:nth-child(4) .let{background:#ef6b8a}
.opt.right{background:var(--okbg);color:var(--okc)}.opt.wrong{background:var(--badbg);color:var(--badc)}
.center{text-align:center}.trophy{font-size:96px;margin:20px 0 6px;filter:drop-shadow(5px 8px 6px rgba(0,0,0,.25))}
.lesson{padding:26px 20px;margin-top:6px;text-align:center}.lesson .big2{font-size:90px;filter:drop-shadow(5px 8px 6px rgba(0,0,0,.22))}.lesson p{font-size:19px;line-height:1.5;margin:14px 0 6px}
.field{width:100%;padding:14px 16px;border:var(--bdt);border-radius:var(--rs);font:inherit;font-weight:800;background:var(--well);color:var(--ink);box-shadow:var(--sin)}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:18px}.sum div{padding:14px 6px;text-align:center}.sum b{display:block;font-size:24px;font-weight:900}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tp{display:flex;flex-direction:column;gap:6px;padding:10px 10px 12px;border-radius:var(--r);background:var(--card);border:var(--bd);box-shadow:var(--sh);transition:transform .12s}.tp:active{transform:scale(.97)}
.tp b{font-size:15px;font-weight:900}.tp.sel{outline:3px solid var(--accent);outline-offset:2px}.chk{font-size:12px;font-weight:900;color:var(--accent)}
.tpv{display:flex;flex-direction:column;justify-content:center;gap:9px;min-height:118px;padding:12px;border-radius:var(--rs);background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden}
.mc{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:var(--rs);background:var(--card);border:var(--bd);box-shadow:var(--shs);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.mc b{font-size:15px}.mc span{width:18px;height:18px;border-radius:50%;background:var(--accentg)}
.mb{padding:7px;text-align:center;font-weight:900;font-size:13px;border-radius:var(--rs);background:var(--accentg);color:var(--onacc);border:var(--bd);box-shadow:var(--shs)}
nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;padding:10px 10px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;gap:4px;z-index:5;background:var(--navbg);border-top:var(--bd);border-radius:26px 26px 0 0;box-shadow:var(--navsh)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 1px;border-radius:var(--rs);font-size:10px;font-weight:800;color:var(--mute);background:transparent;text-align:center}
nav button span{font-size:21px}nav button.on{color:var(--accent);background:var(--card);border:var(--bdt);box-shadow:var(--shs)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--bgc);padding:11px 20px;border-radius:99px;font-weight:800;transition:.25s;pointer-events:none;z-index:9}.toast.show{transform:translate(-50%,0);opacity:1}
.sndrow{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;font-weight:900}
input[type=range]{width:100%;accent-color:var(--accent);margin:8px 0 10px}
.gc{display:flex;flex-direction:column;gap:6px;padding:16px 14px;border-radius:var(--r);background:var(--card);border:var(--bd);box-shadow:var(--sh);transition:transform .12s}.gc:active{transform:scale(.97)}
.gi{width:64px;height:64px;border-radius:var(--rs);display:grid;place-items:center;font-size:34px;background:var(--tilebg);border:var(--bdt);box-shadow:var(--shs);margin-bottom:4px}
.gc b{font-weight:900}.gc .bs{font-size:12px;color:var(--accent);font-weight:800}
.gstage{padding:18px;text-align:center}.gstage .row2{display:flex;justify-content:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.arena{position:relative;height:360px;border-radius:var(--rs);background:var(--well);border:var(--bdt);box-shadow:var(--sin);overflow:hidden;margin-bottom:6px}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:300px;margin:0 auto 14px}
.pad{aspect-ratio:1;border-radius:var(--r);border:var(--bd);box-shadow:var(--sht);opacity:.72;transition:transform .1s,opacity .1s,filter .1s}
.pad.lit{opacity:1;filter:brightness(1.35) saturate(1.2);transform:scale(.94)}
.balloon{position:absolute;bottom:-72px;width:56px;height:68px;border-radius:50% 50% 48% 48%;font-weight:900;font-size:20px;display:grid;place-items:center;color:#fff;border:0;text-align:center;animation:rise var(--dur,5s) linear forwards;box-shadow:inset -6px -6px 10px rgba(0,0,0,.22),inset 5px 5px 8px rgba(255,255,255,.4),3px 5px 10px rgba(0,0,0,.2)}
@keyframes rise{to{transform:translateY(-460px)}}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:340px;margin:0 auto 10px}
.hole{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:44px;text-align:center;background:var(--well);border:var(--bdt);box-shadow:var(--sin);overflow:hidden}
.hole span{transform:scale(0);transition:transform .12s}.hole.up span{transform:scale(1)}
.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.key{padding:10px 0;text-align:center;border-radius:12px;font-weight:900;background:var(--card);border:var(--bdt);box-shadow:var(--shs)}.key:disabled{opacity:.3}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.slot,.tileL{width:44px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:24px;font-weight:900;text-align:center}
.slot{background:var(--well);border:var(--bdt);box-shadow:var(--sin)}.tileL{background:var(--card);border:var(--bdt);box-shadow:var(--shs)}
.word{font-size:32px;letter-spacing:5px;font-weight:900;margin:8px 0}
.oo{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.oo.six{grid-template-columns:repeat(3,1fr)}
.oo button{aspect-ratio:1;border-radius:var(--r);font-size:46px;text-align:center;background:var(--card);border:var(--bd);box-shadow:var(--shs);display:grid;place-items:center;transition:transform .12s}
.oo.six button{font-size:34px}.oo button.right{background:var(--okbg)}.oo button.wrong{background:var(--badbg)}
.gmsg{font-size:19px;font-weight:900;min-height:28px;margin:0 0 12px}

const WORDS=[['CAT','🐱'],['DOG','🐶'],['FISH','🐟'],['LION','🦁'],['APPLE','🍎'],['MANGO','🥭'],['TIGER','🐯'],['ZEBRA','🦓'],['HORSE','🐴'],['BANANA','🍌'],['MOON','🌙'],['STAR','⭐'],['TREE','🌳'],['BIRD','🐦'],['FROG','🐸'],['DUCK','🦆'],['CAKE','🍰'],['BOOK','📚'],['SHIP','🚢'],['SUN','☀️']];
function scramble(el){
  let round,score,words,pool,ans,w,tm=[];
  function start(){round=0;score=0;words=shuffle(WORDS).slice(0,5);next()}
  function next(){
    if(round>=5)return endScreen(el,'scramble',score,'correct',start);
    w=words[round];let L;do{L=shuffle(w[0].split(''))}while(L.join('')===w[0]&&w[0].length>2);
    pool=L.map(c=>({c,used:false}));ans=[];draw()}
  function draw(){
    el.innerHTML=chips([['Word '+(round+1)+'/5'],['Score '+score]])+`<div style="font-size:72px;filter:drop-shadow(3px 5px 4px rgba(0,0,0,.2))">${w[1]}</div><div class="slots">${w[0].split('').map((_,k)=>`<button class="slot" data-k="${k}" aria-label="Letter ${k+1}">${ans[k]?ans[k].c:''}</button>`).join('')}</div><div class="slots">${pool.map((p,i)=>`<button class="tileL" data-i="${i}" ${p.used?'disabled style="opacity:.3"':''}>${p.c}</button>`).join('')}</div><button class="cta alt" id="sk">Skip</button>`;
    el.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{ans.splice(+b.dataset.k).forEach(x=>x.used=false);sfx('tap');draw()});
    el.querySelectorAll('.tileL').forEach(b=>b.onclick=()=>{
      const p=pool[+b.dataset.i];if(p.used)return;p.used=true;ans.push(p);sfx('tap');
      if(ans.length===w[0].length){
        if(ans.map(x=>x.c).join('')===w[0]){score++;sfx('correct');draw();tm.push(setTimeout(()=>{round++;next()},700))}
        else{sfx('wrong');pool.forEach(x=>x.used=false);ans=[];draw()}}
      else draw()});
    el.querySelector('#sk').onclick=()=>{sfx('tap');round++;next()}}
  start();return()=>tm.forEach(clearTimeout)}

const WL=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function ttt2(el){
  let b,turn,over,sc={X:0,O:0,D:0};
  const em=t=>t==='X'?'❌':'⭕';
  function start(){b=Array(9).fill(null);turn='X';over=false;draw()}
  function draw(msg){
    el.innerHTML=chips([['❌ '+sc.X],['⭕ '+sc.O],['🤝 '+sc.D]])+`<p class="gmsg">${msg||'Turn: '+em(turn)}</p><div class="cells" style="grid-template-columns:repeat(3,1fr);max-width:320px;margin:0 auto 14px"></div>${over?'<button class="cta" id="ag">Play again</button>':''}`;
    const g=el.querySelector('.cells');
    b.forEach((v,i)=>{const c=document.createElement('button');c.className='cell';c.textContent=v?em(v):'';c.setAttribute('aria-label','Square '+(i+1));c.onclick=()=>play(i);g.appendChild(c)});
    const a=el.querySelector('#ag');if(a)a.onclick=()=>{sfx('tap');start()}}
  function play(i){
    if(over||b[i])return;b[i]=turn;sfx('tap');
    if(WL.some(l=>l.every(k=>b[k]===turn))){over=true;sc[turn]++;gadd(5);sfx('end',2);return draw(em(turn)+' wins!')}
    if(b.every(Boolean)){over=true;sc.D++;sfx('end',0);return draw('Draw!')}
    turn=turn==='X'?'O':'X';draw()}
  start()}

function connect4(el){
  const R=6,C=7,col=['#ef4444','#facc15'];let g,turn,over,sc=[0,0];
  function start(){g=Array.from({length:R},()=>Array(C).fill(-1));turn=0;over=false;draw()}
  function win(r,c){const p=g[r][c];for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){let n=1;for(const s of [1,-1]){let rr=r+dr*s,cc=c+dc*s;while(rr>=0&&rr<R&&cc>=0&&cc<C&&g[rr][cc]===p){n++;rr+=dr*s;cc+=dc*s}}if(n>=4)return true}return false}
  function drop(c){
    if(over)return;let r=R-1;while(r>=0&&g[r][c]!==-1)r--;if(r<0){sfx('wrong');return}
    g[r][c]=turn;sfx('tap');
    if(win(r,c)){over=true;sc[turn]++;gadd(5);sfx('end',2);return draw((turn?'🟡':'🔴')+' wins!')}
    if(g[0].every(x=>x!==-1)){over=true;sfx('end',0);return draw('Draw!')}
    turn=1-turn;draw()}
  function draw(msg){
    el.innerHTML=chips([['🔴 '+sc[0]],['🟡 '+sc[1]]])+`<p class="gmsg">${msg||'Turn: '+(turn?'🟡':'🔴')}</p><div class="c4grid">${g.map(row=>row.map((v,c)=>`<button class="c4" data-c="${c}" aria-label="Column ${c+1}" style="background:${v<0?'#eef0ff':col[v]}"></button>`).join('')).join('')}</div>${over?'<button class="cta" id="ag">Play again</button>':''}`;
    el.querySelectorAll('.c4').forEach(b=>b.onclick=()=>drop(+b.dataset.c));
    const a=el.querySelector('#ag');if(a)a.onclick=()=>{sfx('tap');start()}}
  start()}

function tug(el){
  let pos,run,tm=[];
  function start(){
    pos=50;run=false;
    el.innerHTML=`<div class="duel"><div class="half p2" style="--pc:#ef4444"><div class="who">Player 2</div><button class="bigbtn" id="b2">TAP FAST!</button></div><div class="mid" id="md">Get ready…</div><div class="track" id="tr"></div><div class="half" style="--pc:#3b82f6"><div class="who">Player 1</div><button class="bigbtn" id="b1">TAP FAST!</button></div></div>`;
    const md=el.querySelector('#md'),tr=el.querySelector('#tr');
    const paint=()=>{tr.style.background=`linear-gradient(90deg,#3b82f6 ${pos}%,#ef4444 ${pos}%)`};paint();
    const pull=d=>{if(!run)return;pos=Math.max(0,Math.min(100,pos+d));paint();
      if(pos<=0||pos>=100){run=false;const w=pos>=100?1:2;sfx('end',2);gadd(5);md.textContent='🏆 Player '+w+' wins!';
        el.insertAdjacentHTML('beforeend','<button class="cta" id="ag">Play again</button>');el.querySelector('#ag').onclick=()=>{sfx('tap');start()}}};
    ['1','2'].forEach(k=>el.querySelector('#b'+k).addEventListener('pointerdown',e=>{e.preventDefault();pull(k==='1'?2.2:-2.2)}));
    ['3','2','1','GO!'].forEach((t,i)=>tm.push(setTimeout(()=>{md.textContent=t;sfx(i===3?'correct':'tap');if(i===3)run=true},i*800)))}
  start();return()=>tm.forEach(clearTimeout)}

function react(el){
  let s,state,tm=[];
  const later=(f,ms)=>{tm.push(setTimeout(f,ms))};
  function start(){
    s=[0,0];state='idle';
    el.innerHTML=`<div class="duel"><div class="half p2" style="--pc:#ef4444"><div class="who">Player 2</div><button class="bigbtn pad2" data-p="1">TAP</button></div><div class="mid" id="md"></div><div class="half" style="--pc:#3b82f6"><div class="who">Player 1</div><button class="bigbtn pad2" data-p="0">TAP</button></div></div>`;
    const md=el.querySelector('#md'),pads=[...el.querySelectorAll('.pad2')];
    const paint=c=>pads.forEach(x=>x.style.background=c),score=()=>'P1 '+s[0]+' – '+s[1]+' P2';
    function round(){state='wait';paint('#ef4444');md.textContent='Wait for GREEN… '+score();
      later(()=>{if(state!=='wait')return;state='go';paint('#22c55e');md.textContent='GO!';sfx('note',3)},1500+Math.random()*2500)}
    function point(p,why){
      state='over';s[p]++;sfx('correct');md.textContent='P'+(p+1)+' scores! '+why+'  '+score();
      if(s[p]>=3)later(()=>{md.textContent='🏆 Player '+(p+1)+' wins!';gadd(5);sfx('end',2);el.insertAdjacentHTML('beforeend','<button class="cta" id="ag">Play again</button>');el.querySelector('#ag').onclick=()=>{sfx('tap');start()}},900);
      else later(round,1500)}
    pads.forEach(pd=>pd.addEventListener('pointerdown',e=>{e.preventDefault();const p=+pd.dataset.p;
      if(state==='wait')point(1-p,'(P'+(p+1)+' tapped too early)');else if(state==='go')point(p,'Fast!')}));
    md.textContent='Get ready… first to 3 wins';later(round,1200)}
  start();return()=>tm.forEach(clearTimeout)}

function mathduel(el){
  let s,ans,lock,done,tm=[];
  function start(){s=[0,0];q()}
  function q(){
    const a=2+rand(10),b=2+rand(10),op=['+','−','×'][rand(3)];ans=op==='+'?a+b:op==='−'?a-b:a*b;
    const set=new Set([ans]);while(set.size<4)set.add(Math.max(0,ans+rand(11)-5));
    lock=[false,false];done=false;
    const half=(p,cls,c)=>`<div class="half ${cls}" style="--pc:${c}"><div class="who">Player ${p+1}</div><div class="qbig">${a} ${op} ${b} = ?</div><div class="opts2">${shuffle([...set]).map(v=>`<button class="mb2" data-p="${p}" data-v="${v}">${v}</button>`).join('')}</div></div>`;
    el.innerHTML=`<div class="duel">${half(1,'p2','#ef4444')}<div class="mid">P1 ${s[0]} – ${s[1]} P2 (first to 5)</div>${half(0,'','#3b82f6')}</div>`;
    el.querySelectorAll('.mb2').forEach(b=>b.onclick=()=>{
      const p=+b.dataset.p;if(done||lock[p])return;
      if(+b.dataset.v===ans){done=true;s[p]++;sfx('correct');b.style.background='var(--okbg)';tm.push(setTimeout(()=>s[p]>=5?end(p):q(),900))}
      else{lock[p]=true;sfx('wrong');b.style.background='var(--badbg)';b.disabled=true;if(lock[0]&&lock[1]){done=true;tm.push(setTimeout(q,800))}}})}
  function end(p){
    gadd(5);sfx('end',2);
    el.innerHTML=`<div class="trophy">🏆</div><h2>Player ${p+1} wins!</h2><p style="color:var(--mute)">P1 ${s[0]} – ${s[1]} P2</p><button class="cta" id="ag">Play again</button>`;
    el.querySelector('#ag').onclick=()=>{sfx('tap');start()}}
  start();return()=>tm.forEach(clearTimeout)}

function rps2(el){
  const E=['✊','✋','✌️'];let s,ch,lock,tm=[];
  function start(){s=[0,0];ch=[null,null];lock=false;draw('Pick one!')}
  function side(p,cls,c){
    const x=ch[p];
    return `<div class="half ${cls}" style="--pc:${c}"><div class="who">Player ${p+1}</div>${lock?`<div class="qbig">${E[x]}</div>`:x!=null?'<div class="qbig">✔ Ready</div>':`<div class="opts3">${E.map((e,i)=>`<button class="mb2" data-p="${p}" data-i="${i}">${e}</button>`).join('')}</div>`}</div>`}
  function draw(msg){
    el.innerHTML=`<div class="duel">${side(1,'p2','#ef4444')}<div class="mid">${msg}<br>P1 ${s[0]} – ${s[1]} P2 (first to 3)</div>${side(0,'','#3b82f6')}</div>`;
    el.querySelectorAll('.mb2').forEach(b=>b.onclick=()=>pick(+b.dataset.p,+b.dataset.i))}
  function pick(p,i){
    if(lock||ch[p]!=null)return;ch[p]=i;sfx('tap');
    if(ch[0]!=null&&ch[1]!=null){
      lock=true;const r=(ch[0]-ch[1]+3)%3,w=r===1?0:r===2?1:-1;if(w>=0)s[w]++;sfx(w<0?'tap':'correct');
      draw(E[ch[0]]+' vs '+E[ch[1]]+' – '+(w<0?'Draw!':'Player '+(w+1)+' wins the round!'));
      tm.push(setTimeout(()=>{
        if(s[0]>=3||s[1]>=3){const f=s[0]>=3?0:1;gadd(5);sfx('end',2);
          el.innerHTML=`<div class="trophy">🏆</div><h2>Player ${f+1} wins!</h2><p style="color:var(--mute)">P1 ${s[0]} – ${s[1]} P2</p><button class="cta" id="ag">Play again</button>`;
          el.querySelector('#ag').onclick=()=>{sfx('tap');start()}}
        else{ch=[null,null];lock=false;draw('Pick one!')}},1900))}
    else draw('Pick one!')}
  start();return()=>tm.forEach(clearTimeout)}

function snake(el){
  const N=15,Z=20,V={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};let sn,dir,nd,food,score,iv;
  const stop=()=>clearInterval(iv);
  const steer=k=>{const v=V[k];if(v&&dir&&!(v[0]===-dir[0]&&v[1]===-dir[1]))nd=v};
  const place=()=>{do{food=[rand(N),rand(N)]}while(sn.some(s=>s[0]===food[0]&&s[1]===food[1]))};
  const kd=e=>{const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.key];if(m){e.preventDefault();steer(m)}};
  document.addEventListener('keydown',kd);
  function build(){
    el.innerHTML=chips([['Score 0','ss'],['Best '+gb('snake')]])+`<canvas id="cv" class="arena" width="300" height="300" style="width:100%;max-width:300px;height:auto;display:block;margin:0 auto 12px;touch-action:none"></canvas><div class="dpad"><button data-d="u" aria-label="Up">▲</button><div><button data-d="l" aria-label="Left">◀</button><button data-d="r" aria-label="Right">▶</button></div><button data-d="d" aria-label="Down">▼</button></div>`;
    const cv=el.querySelector('#cv'),x=cv.getContext&&cv.getContext('2d');
    el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>steer(b.dataset.d));
    let tx=0,ty=0;
    cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
    cv.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;steer(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'))});
    sn=[[7,7],[6,7],[5,7]];dir=[1,0];nd=dir;score=0;place();
    const paint=()=>{if(!x)return;x.clearRect(0,0,300,300);sn.forEach((s,i)=>{x.fillStyle=i?'#22c55e':'#15803d';x.fillRect(s[0]*Z+1,s[1]*Z+1,Z-2,Z-2)});x.font='17px serif';x.fillText('🍎',food[0]*Z+1,food[1]*Z+16)};
    const tick=()=>{
      dir=nd;const h=[(sn[0][0]+dir[0]+N)%N,(sn[0][1]+dir[1]+N)%N];
      if(sn.some(s=>s[0]===h[0]&&s[1]===h[1])){stop();sfx('wrong');endScreen(el,'snake',score,'apples',build);return}
      sn.unshift(h);
      if(h[0]===food[0]&&h[1]===food[1]){score++;sfx('pop');place();el.querySelector('#ss').textContent='Score '+score}else sn.pop();
      paint()};
    paint();stop();iv=setInterval(tick,170)}
  build();return()=>{stop();document.removeEventListener('keydown',kd)}}

function farm(el){
  let r,score,tm=[];const EM=['🐄','🐑','🐔','🐷','🐴','🦆'];
  function start(){r=0;score=0;next()}
  function next(){
    if(r>=8)return endScreen(el,'farm',score,'correct',start);
    const n=1+rand(9),e=EM[rand(6)],set=new Set([n]);while(set.size<4)set.add(1+rand(10));
    el.innerHTML=chips([['Round '+(r+1)+'/8'],['Score '+score]])+`<p class="gmsg">How many ${e}?</p><div class="arena" style="height:auto;min-height:160px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:14px;font-size:38px">${Array.from({length:n},()=>`<span style="display:inline-block;transform:rotate(${rand(30)-15}deg)">${e}</span>`).join('')}</div><div class="opts2" style="margin-top:12px">${shuffle([...set]).map(v=>`<button class="mb2" data-v="${v}">${v}</button>`).join('')}</div>`;
    const bs=[...el.querySelectorAll('.mb2')];
    bs.forEach(b=>b.onclick=()=>{
      bs.forEach(x=>{x.disabled=true;if(+x.dataset.v===n)x.style.background='var(--okbg)'});
      if(+b.dataset.v===n){score++;sfx('correct')}else{b.style.background='var(--badbg)';sfx('wrong')}
      tm.push(setTimeout(()=>{r++;next()},900))})}
  start();return()=>tm.forEach(clearTimeout)}

function colormatch(el){
  const C=[['RED','#ef4444'],['BLUE','#3b82f6'],['GREEN','#22c55e'],['YELLOW','#facc15'],['PURPLE','#a855f7'],['ORANGE','#f97316']];
  let score,t,iv,run;const stop=()=>{run=false;clearInterval(iv)};
  function start(){
    score=0;t=30;run=true;
    el.innerHTML=chips([['⏱ 30s','ct'],['Score 0','cs']])+`<p class="gmsg">Tap the COLOR of the word, not what it says</p><div id="cw" style="font-size:54px;font-weight:900;margin:12px 0 18px"></div><div class="opts2" id="co"></div>`;
    const cw=el.querySelector('#cw'),co=el.querySelector('#co');
    const ui=()=>{el.querySelector('#ct').textContent='⏱ '+t+'s';el.querySelector('#cs').textContent='Score '+score};
    function next(){
      const wi=rand(6);let ci;do{ci=rand(6)}while(ci===wi);
      cw.textContent=C[wi][0];cw.style.color=C[ci][1];
      const ids=shuffle([ci,...shuffle([0,1,2,3,4,5].filter(k=>k!==ci)).slice(0,3)]);
      co.innerHTML=ids.map(k=>`<button class="mb2" data-k="${k}" aria-label="${C[k][0]}" style="height:64px;background:${C[k][1]}"></button>`).join('');
      co.querySelectorAll('.mb2').forEach(b=>b.onclick=()=>{if(!run)return;if(+b.dataset.k===ci){score++;sfx('pop')}else sfx('wrong');ui();next()})}
    next();ui();
    iv=setInterval(()=>{t--;ui();if(t<=0){stop();endScreen(el,'colormatch',score,'correct',start)}},1000)}
  start();return stop}

function drawNav(tab){
  const t=[['home','🏠','Home'],['explore','🔍','Explore'],['games','🎮','Games'],['progress','📊','Progress'],['themes','🎨','Themes'],['profile','👤','Profile']];
  $('#nav').innerHTML=t.map(([k,e,l])=>`<button class="${k===tab?'on':''}" data-go="/${k}"><span>${e}</span>${l}</button>`).join('');
}
function draw(){
  if(gclean){gclean();gclean=null}
  const v=$('#view'),p=(location.hash.slice(1)||'/home').split('/'),r=p[1];
  let html,tab=r;
  if(r==='course'){html=course(p[2]);tab='home'}
  else if(r==='lesson'){html=lesson(p[2],+p[3]);tab='home'}
  else if(r==='quiz'){if(!Q||Q.id!==p[2]||Q.fresh!==location.hash)startQuiz(p[2]);Q.fresh=location.hash;html=quiz();tab='home'}
  else if(r==='explore')html=explore();
  else if(r==='games'){html=gamesList()}
  else if(r==='game'){html=gameScreen(p[2]);tab='games'}
  else if(r==='progress')html=progress();
  else if(r==='themes')html=themes();
  else if(r==='profile')html=profile();
  else{html=home();tab='home'}
  v.innerHTML=html;drawNav(tab);
  if(r==='game'){const g=GAMES.find(x=>x.id===p[2]);if(g)gclean=g.mount($('#gstage'))||null}
  if(r!=='quiz')window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{if(!location.hash.startsWith('#/quiz'))Q=null;draw()});
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g&&!g.disabled){sfx('tap');go(g.dataset.go);return}
  const a=e.target.closest('[data-act]');if(!a||a.disabled)return;
  const act=a.dataset.act;
  if(act==='complete'){const id=a.dataset.id,i=+a.dataset.i;S.done[id]=S.done[id]||[];
    if(!S.done[id].includes(i)){S.done[id].push(i);S.stars+=10;todayN();S.day.n++;save();toast('+10 ⭐ Lesson complete!');sfx('lesson')}else sfx('tap');go('/course/'+id)}
  else if(act==='pick'){if(Q.picked>=0)return;const k=+a.dataset.k;Q.picked=k;if(k===Q.items[Q.i].a){Q.score++;S.stars+=10;save();sfx('correct')}else sfx('wrong');$('#view').innerHTML=quiz()}
  else if(act==='next'){if(Q.i===Q.items.length-1){Q.end=true;const b=S.best[Q.id];if(b==null||Q.score>b)S.best[Q.id]=Q.score;save();sfx('end',Q.score===Q.items.length?2:Q.score>=Q.items.length/2?1:0)}else{Q.i++;Q.picked=-1;sfx('tap')}$('#view').innerHTML=quiz();window.scrollTo(0,0)}
  else if(act==='retry'){sfx('tap');startQuiz(Q.id);Q.fresh=location.hash;$('#view').innerHTML=quiz();window.scrollTo(0,0)}
  else if(act==='name'){sfx('tap');S.name=($('#nm').value.trim()||'Explorer').slice(0,14);save();toast('Name saved');draw()}
  else if(act==='theme'){S.theme=a.dataset.t;document.documentElement.dataset.theme=S.theme;save();draw();toast('Theme: '+THEMES.find(t=>t[0]===S.theme)[1]);sfx('theme')}
  else if(act==='snd'){S.sound=!S.sound;save();draw();if(S.sound)sfx('tap')}
  else if(act==='reset'){if(confirm('Reset all progress?')){S={name:S.name,done:{},stars:0,best:{},day:{d:'',n:0}};save();draw();toast('Progress reset')}}
});
document.addEventListener('input',e=>{if(e.target.id==='vol'){S.vol=e.target.value/100;save()}});
document.addEventListener('change',e=>{if(e.target.id==='vol')sfx('tap')});
draw();
</script>
