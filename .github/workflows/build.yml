name: Build Android APK

# Place at: .github/workflows/build.yml

on:
  push:
    branches: [main, develop, feature/claude-theme-build]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      release:
        description: "Also build signed release APK + AAB (needs signing secrets)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Vite 8 needs Node 20.19+ / 22.12+ (Node 18 will not work)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # package.json "build" = vite build + wrap-html + copy assets to android
      - name: Build web app
        run: npm run build

      - name: Verify web build output
        run: |
          test -f dist/client/index.html || { echo "dist/client/index.html missing"; exit 1; }
          ls -la dist/client

      # Generates android/app/src/main/assets/capacitor.config.json (gitignored)
      # and syncs plugins + web assets into the Android project
      - name: Capacitor sync
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: india-explorer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # ---------- Signed release (main branch or manual run only) ----------
      # Required repo secrets:
      #   ANDROID_KEYSTORE_BASE64   base64 of your .jks   (base64 -w0 word-wizard.jks)
      #   ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_ALIAS
      #   ANDROID_KEY_PASSWORD
      # Requires android/app/build.gradle to read keystore.properties
      # (see review notes: remove the hardcoded signingConfig).
      - name: Check for signing secrets
        id: signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi

      - name: Prepare signing config
        if: >-
          steps.signing.outputs.available == 'true' &&
          (github.ref == 'refs/heads/main' || inputs.release == true)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > $RUNNER_TEMP/release.jks

      - name: Build signed release (APK + AAB)
        if: >-
          steps.signing.outputs.available == 'true' &&
          (github.ref == 'refs/heads/main' || inputs.release == true)
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload release artifacts
        if: >-
          steps.signing.outputs.available == 'true' &&
          (github.ref == 'refs/heads/main' || inputs.release == true)
        uses: actions/upload-artifact@v4
        with:
          name: india-explorer-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Clean up signing material
        if: always()
        run: rm -f $RUNNER_TEMP/release.jks
