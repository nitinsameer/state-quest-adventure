name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Start dev server
        run: npm run dev &
        
      - name: Wait for dev server
        run: |
          for i in {1..60}; do
            if curl -f http://localhost:8080 > /dev/null 2>&1; then
              echo "Dev server is ready"
              exit 0
            fi
            echo "Waiting for dev server... ($i/60)"
            sleep 2
          done
          echo "Dev server failed to start"
          exit 1

      - name: Run E2E tests (Shard ${{ matrix.shard }}/4)
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test videos
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-videos-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  merge-reports:
    # Merge reports after test runs
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-optional

      - name: Download blob reports from all shards
        uses: actions/download-artifact@v3
        with:
          path: all-blob-reports
          pattern: playwright-report-shard-*

      - name: Merge reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v3
        with:
          name: html-report
          path: playwright-report
          retention-days: 14

  comment-on-pr:
    if: github.event_name == 'pull_request' && always()
    needs: [merge-reports]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download HTML report
        uses: actions/download-artifact@v3
        with:
          name: html-report
          path: playwright-report

      - name: Comment PR with test results
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const testResults = fs.existsSync('playwright-report/index.html') ? '✅ Tests passed' : '❌ Tests failed';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## E2E Test Results\n\n${testResults}\n\n📊 [View detailed report](https://github.com/${ context.repo.owner }/${ context.repo.repo }/actions/runs/${ context.runId })`
            });
